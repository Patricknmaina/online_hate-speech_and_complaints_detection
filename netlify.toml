[build]
  base = "frontend"
  publish = "dist"
  command = "npm ci && npm run build"

# Pass API base URL at build time (override in Netlify UI as needed)
[build.environment]
  VITE_API_BASE_URL = "http://54.198.218.248:8000"

# SPA fallback so route refreshes don’t 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
